# ===================================================================
# Test Environment Application Configuration
# Uses in-memory H2 database in PostgreSQL compatibility mode for hermetic tests
# ===================================================================

spring.datasource.url=jdbc:h2:mem:smart_waste_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in unit/mock tests (schema generated cleanly by JPA create-drop)
spring.flyway.enabled=false

# Thymeleaf cache disabled
spring.thymeleaf.cache=false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Smart Pulse Ring (IoT sensor indicator) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Bin Lid -->
  <rect x="30" y="32" width="40" height="6" rx="3" fill="#ffffff" />
  <!-- Lid Handle -->
  <rect x="44" y="27" width="12" height="4" rx="2" fill="#ffffff" />

  <!-- Bin Body -->
  <path d="M 33 41 L 37 72 C 37.5 75 40 77 43 77 L 57 77 C 60 77 62.5 75 63 72 L 67 41 Z" fill="#ffffff" />

  <!-- Recycling Arrows Emblem on the Bin -->
  <path d="M 50 49 L 55 54 L 52 54 C 52 57 50.5 59.5 48 60.5 L 46.5 58 C 48.5 57 49.5 55.5 49.5 54 L 46.5 54 Z" fill="#059669" />
  <path d="M 45 61 L 43.5 56 L 46 56 C 45 54 43 53 41 53.5 L 41.5 51 C 44.5 50.5 47.5 52 48.5 54.5 L 47 56 Z" fill="#059669" />
  
  <!-- Small IoT Status Signal Indicator Dot -->
  <circle cx="68" cy="28" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
</svg>

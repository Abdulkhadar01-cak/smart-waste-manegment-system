<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>My Profile</h2>
            <p class="text-muted">View your account information.</p>
        </div>

        <a th:href="@{/citizen/dashboard}" class="btn btn-outline-success">
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <i class="bi bi-person-circle"
                   style="font-size: 70px; color: #198754;"></i>

                <h4 class="mt-2" th:text="${citizen.fullName}"></h4>

                <span class="badge bg-success">CITIZEN</span>

            </div>

            <hr>

            <div class="mb-3">
                <label class="form-label text-muted">Full Name</label>
                <p class="fw-semibold" th:text="${citizen.fullName}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted">Email Address</label>
                <p class="fw-semibold" th:text="${citizen.email}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted">Phone Number</label>
                <p class="fw-semibold" th:text="${citizen.phoneNumber}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted">Account Role</label>
                <p class="fw-semibold" th:text="${citizen.role}"></p>
            </div>

        </div>
    </div>

</div>

</body>
</html>

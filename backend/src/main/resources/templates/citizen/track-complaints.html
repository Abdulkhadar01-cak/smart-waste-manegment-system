<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaints</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Track Complaints</h2>
            <p class="text-muted">Check the latest status of your complaints.</p>
        </div>

        <a th:href="@{/citizen/dashboard}" class="btn btn-outline-success">
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm"
         th:if="${not #lists.isEmpty(complaints)}">

        <div class="card-body table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Complaint Type</th>
                    <th>Description</th>
                    <th>Address</th>
                    <th>Current Status</th>
                    <th>Submitted On</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.complaintType}"></td>
                    <td th:text="${complaint.description}"></td>
                    <td th:text="${complaint.address}"></td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:if="${complaint.status == 'PENDING'}">
                            PENDING
                        </span>

                        <span class="badge bg-info text-dark"
                              th:if="${complaint.status == 'ASSIGNED'}">
                            ASSIGNED
                        </span>

                        <span class="badge bg-primary"
                              th:if="${complaint.status == 'IN_PROGRESS'}">
                            IN PROGRESS
                        </span>

                        <span class="badge bg-success"
                              th:if="${complaint.status == 'COMPLETED'}">
                            COMPLETED
                        </span>

                        <span class="badge bg-danger"
                              th:if="${complaint.status == 'REJECTED'}">
                            REJECTED
                        </span>
                    </td>

                    <td th:text="${complaint.createdAt}"></td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

    <div class="card shadow-sm text-center p-5"
         th:if="${#lists.isEmpty(complaints)}">

        <h5>No complaints to track</h5>

        <p class="text-muted">
            Your submitted complaints will appear here.
        </p>

        <div>
            <a th:href="@{/citizen/complaints/new}"
               class="btn btn-success">
                Report Waste
            </a>
        </div>

    </div>

</div>

</body>
</html>

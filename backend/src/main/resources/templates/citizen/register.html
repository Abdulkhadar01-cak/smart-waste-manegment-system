<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration | Smart Waste Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f0f5f1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #198754;
            font-weight: bold;
        }

        .btn-register {
            background: #198754;
            color: white;
            width: 100%;
        }

        .btn-register:hover {
            background: #146c43;
            color: white;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <h2>Citizen Registration</h2>
        <p class="text-muted">Create your Smart Waste Management account</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/citizen/register}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control"
                   placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phoneNumber" class="form-control"
                   placeholder="Enter your phone number" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Create a password" minlength="8" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-control"
                   placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="btn btn-register py-2">
            Create Account
        </button>

    </form>

    <div class="text-center mt-3">
        <p class="mb-0">
            Already have an account?
            <a th:href="@{/citizen/login}">Login here</a>
        </p>
    </div>

</div>

</body>
</html>

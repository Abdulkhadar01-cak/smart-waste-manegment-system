<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>My Complaints</h2>
            <p class="text-muted">View all the complaints you have submitted.</p>
        </div>

        <a th:href="@{/citizen/dashboard}" class="btn btn-outline-success">
            Back to Dashboard
        </a>
    </div>

    <!-- When complaints exist -->
    <div class="card shadow-sm" th:if="${not #lists.isEmpty(complaints)}">
        <div class="card-body table-responsive">

            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Complaint Type</th>
                    <th>Description</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th>Submitted On</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.complaintType}"></td>
                    <td th:text="${complaint.description}"></td>
                    <td th:text="${complaint.address}"></td>
                    <td>
                        <span class="badge bg-warning text-dark"
                              th:text="${complaint.status}">
                        </span>
                    </td>
                    <td th:text="${complaint.createdAt}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- When there are no complaints -->
    <div class="card shadow-sm text-center p-5"
         th:if="${#lists.isEmpty(complaints)}">

        <h5>No complaints found</h5>
        <p class="text-muted">
            You haven't submitted any complaints yet.
        </p>

        <div>
            <a th:href="@{/citizen/complaints/new}"
               class="btn btn-success">
                Report Waste
            </a>
        </div>
    </div>

</div>

</body>
</html>

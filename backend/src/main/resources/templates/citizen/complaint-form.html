<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Waste | SmartWaste</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7f6;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 750px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .form-title {
            color: #145c3a;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-submit {
            background: #198754;
            color: white;
            padding: 11px 25px;
        }

        .btn-submit:hover {
            background: #145c3a;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-container">

        <a th:href="@{/citizen/dashboard}"
           class="text-success text-decoration-none">
            ← Back to Dashboard
        </a>

        <h2 class="form-title mt-4">Report Waste</h2>

        <p class="text-muted">
            Help keep your surroundings clean by reporting waste-related issues.
        </p>

        <!-- Error Message -->
        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/citizen/complaints}" method="post">

            <!-- CSRF Token -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Complaint Type -->
            <div class="mb-4">

                <label class="form-label">Complaint Category *</label>

                <select name="complaintType" class="form-select" required>

                    <option value="">Select complaint category</option>

                    <option value="HOME_GARBAGE">
                        Home Garbage Pickup
                    </option>

                    <option value="PUBLIC_DUSTBIN">
                        Public Dustbin Overflow
                    </option>

                    <option value="PUBLIC_AREA">
                        Public Area Cleaning
                    </option>

                </select>

            </div>

            <!-- Description -->
            <div class="mb-4">

                <label class="form-label">Description *</label>

                <textarea name="description"
                          class="form-control"
                          rows="4"
                          placeholder="Describe the waste-related problem..."
                          required></textarea>

            </div>

            <!-- Address -->
            <div class="mb-4">

                <label class="form-label">Location / Address *</label>

                <textarea name="address"
                          class="form-control"
                          rows="2"
                          placeholder="Enter the complete address..."
                          required></textarea>

            </div>

            <!-- Submit -->
            <div class="d-flex justify-content-between align-items-center">

                <a th:href="@{/citizen/dashboard}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-submit">
                    Submit Complaint
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>

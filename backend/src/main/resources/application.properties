# ===================================================================
# Smart Waste Management System - Backend Application Configuration
# ===================================================================

# -------------------------------------------------------------------
# Server Settings
# -------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.application.name=smart-waste-management

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Cache templates in memory (set to false for local dev to enable hot reload)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# -------------------------------------------------------------------
# Static Web Resources Configuration
# -------------------------------------------------------------------
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL Driver)
# Credentials and host parameters are configured via environment variables.
# No hardcoded production passwords or hosts.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_waste_db}?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool Settings
# 'initialization-fail-timeout=-1' ensures the backend boots up gracefully
# even if the PostgreSQL instance is started asynchronously or later.
# -------------------------------------------------------------------
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate ORM Configuration
# Setting PostgreSQLDialect explicitly allows Hibernate to initialize
# without requiring live database connection metadata on startup.
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migration Configuration
# When FLYWAY_ENABLED=true and DB is reachable, Flyway automatically
# migrates schemas located in classpath:db/migration.
# -------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.smartwaste=DEBUG
